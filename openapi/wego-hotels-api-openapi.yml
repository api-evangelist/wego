                        text:
                          type: string
                          description: The review snippet text.
                      required:
                      - text
                  highlights:
                    description: Editorial badges from the hotel content service.
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          description: Badge label.
                        subtext:
                          description: Badge supporting text, when present.
                          type: string
                      required:
                      - text
                required:
                - hotelId
                - name
                - pageUrl
                - location
        '400':
