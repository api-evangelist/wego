summary: Wego runs a first-party remote MCP server at https://api.wego.com/mcp. It is the "Wego connector"
  listed in the Claude connectors directory, and it projects the same flight/hotel/place funnel the REST
  API exposes. The endpoint is OAuth-protected and advertises RFC 9728 protected-resource metadata plus
  RFC 8414 authorization-server metadata with dynamic client registration, so an MCP client can complete
  the whole authorization dance without a human pasting a token.
