- aid: wego:wego-places-api
  name: Wego Places API
  description: >-
    Turn free text into typed travel locations. `getPlaces` resolves a city, airport, district or hotel
    name to results carrying the codes the flight and hotel searches take as input. `getNearbyPlaces`
    answers the follow-up – which other airports serve the same trip – from a place code or a coordinate
    pair.
