aid: wego
name: Wego
description: 'Wego (Wego Pte Ltd, Singapore, with a regional base in Dubai) is a travel
  metasearch engine and online travel agency serving travelers across the Middle East,
  North Africa, Southeast Asia and beyond. It compares flights and hotels across airlines,
  hotels and online travel agencies, and sells Book-on-Wego inventory directly. Wego
  exposes that same search core through four public API surfaces: the OAuth2-protected
  Wego API (an agent-native REST contract over places, flights, hotels, fares and rates,
  published as OpenAPI 3.1 at api.wego.com/openapi, plus a remote MCP server, a wego
  CLI and a published Agent Skill), a Marketplace/Affiliate metasearch API for partners
  who embed Wego comparison into their own sites, and Flight and Hotel B2B Distribution
  APIs for partners syndicating Book-on-Wego inventory.'
