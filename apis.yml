- aid: wego-affiliate
  image: https://avatars.githubusercontent.com/u/69198?v=4
  name: Wego Marketplace (Affiliate) API
  description: 'The affiliate metasearch API: partners add Wego flight and hotel comparison
    to their own site or app. Client-credentials OAuth2, create a search, poll for results,
    then hand travelers off to Wego partner deep links. Rate limited to 500 search calls
    per hour on a regular key and 50 per hour on a test key, conditioned on maintaining
    a search-to-click ratio of at least 5%.'
  humanURL: https://developers.wego.com/docs/affiliate/get-started
  baseURL: https://affiliate-api.wego.com
