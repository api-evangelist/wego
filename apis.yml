  image: https://avatars.githubusercontent.com/u/69198?v=4
  name: Wego API
  description: 'The public Wego API: resolve travel locations, create asynchronous
    flight and hotel searches, read ranked results, open one trip or hotel, list fares
    and room rates, and build wego.com booking or share links. Reference lookups (public
    holidays, visa-free destinations, flight schedules, nearby airports) need no search
    at all. OAuth2 bearer, RFC 9457 problem bodies, RateLimit headers. Research Preview.'
