- aid: wego:wego-flights-api
  name: Wego Flights API
  description: >-
    The flight funnel: `createFlightSearch` starts an async search, `getFlightSearchResults` reads ranked
    snapshots while providers answer, `getFlightTrip` opens one trip with every fare. Fares with `kind:
    "wego"` continue into `getFareOptions` and `getFareBookingLink`; airline and partner fares carry their
    own handoff URL instead. Ids expire; a `404` means search again. `getFlightSchedules` sits outside
    the funnel – a published timetable with no prices and no search to settle.
  humanURL: https://docs.wego.com/api
  baseURL: https://api.wego.com
  tags:
  - Flights
