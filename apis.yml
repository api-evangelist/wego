- aid: wego-distribution-flight
  image: https://avatars.githubusercontent.com/u/69198?v=4
  name: Wego Flight B2B Distribution API v3
  description: 'B2B distribution API for partners to search and retrieve available flight
    prices and itineraries from Wego inventory. OAuth2 client-credentials with a flight.search
    scope; staging access is IP-whitelisted. Documented on the Wego Developers Portal
    as OpenAPI 3.0.0, though the portal''s "Export OpenAPI Spec" download does not resolve.'
  humanURL: https://developers.wego.com/docs/distribution/flight/api/flight-b-2-b-distribution-apis-v-3
  baseURL: https://api.wego.com
