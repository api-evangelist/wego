- aid: wego-distribution-hotel
  image: https://avatars.githubusercontent.com/u/69198?v=4
  name: Wego Hotel B2B Distribution API
  description: 'B2B distribution API for partners to pull static property content, price
    hotel rates for search criteria, and complete the full booking flow (price-check,
    book, cancel, retrieve). OAuth2 client-credentials with hotel.search and hotel.booking
    scopes; staging access is IP-whitelisted. Documented on the Wego Developers Portal
    as OpenAPI 1.0.0, though the portal''s "Export OpenAPI Spec" download does not resolve.'
  humanURL: https://developers.wego.com/docs/distribution/hotel/api/hotel-b-2-b-distribution-apis
