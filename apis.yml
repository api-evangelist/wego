- aid: wego:wego-countries-api
  name: Wego Countries API
  description: >-
    Country-keyed reference data an agent can call before any search, and combine. `getCountryHolidays`
    returns a market's public holidays for spotting long weekends; `getVisaFreeDestinations` returns where
    a passport travels without a visa, as one complete list. Both take an ISO 3166-1 alpha-2 code as their
    only path key, which is what groups them under one tag – their results combine (visa-free supplies
    the destinations, holidays the free dates), rather than intersecting on a shared row field, since
    a holiday row carries no country code of its own. The visa list carries no visa type and no permitted
    stay – an absent country means absent from Wego's list, not that a visa is required.
  humanURL: https://docs.wego.com/api
  baseURL: https://api.wego.com
  tags:
  - Countries
