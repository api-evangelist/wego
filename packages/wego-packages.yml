  https://docs.wego.com/cli, https://api.wego.com/install
note: >-
  Wego ships no first-party HTTP client SDK for the current Wego API. The agent-facing
  distribution is a signed Go binary (the `wego` CLI) installed from the provider's own
  host, plus a published Agent Skill repository - neither of which has a package registry.
  The one first-party library on npm, wego-sdk, wraps the older Wego marketplace surface
  and has not been published since 2019-01-09. npm `wego` and PyPI `wego` are unrelated
  WeChat libraries from other authors and are deliberately excluded.
