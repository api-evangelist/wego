summary: >-
  The B2B Distribution APIs return an HTTP status plus a numeric error code and message in
  the body. The code space is shared between the flight and hotel surfaces for auth, rate
  limiting and validation (10xxx / 4000x), and the hotel surface adds booking-lifecycle
  codes the flight surface does not have.
http_status_codes:
- status: 400
  meaning: Bad Request - the request could not be understood, malformed syntax.
- status: 401
  meaning: Unauthorized - ApiKey not found, or IP address restrictions violated.
- status: 403
  meaning: Forbidden - the authenticated client is not allowed to access the resource.
- status: 429
  meaning: Too Many Requests.
- status: 500
  meaning: Internal Server Error - unrecoverable problem processing the call.
- status: 503
  meaning: Service Unavailable - planned or ad-hoc maintenance.
